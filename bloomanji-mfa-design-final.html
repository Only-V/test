<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification — Bloomanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C447C;
    --blue:#378ADD;
    --blue-light:#85B7EB;
    --blue-accent:#185FA5;
    --text:#1c2b3a;
    --muted:#6b7c90;
    --line:#e6ecf3;
    --bg:#eef3f9;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(90% 60% at 50% -10%, #e2ecf8 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;max-width:420px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:22px;
    padding:44px 40px 38px;
    box-shadow:0 20px 50px -24px rgba(12,68,124,.28), 0 2px 8px rgba(12,68,124,.04);
  }

  .logo{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:26px;}
  .logo .symbol{width:42px;height:42px;animation:bloom 1s cubic-bezier(.2,.8,.2,1) both;}
  .logo .wordmark{font-family:'Inter',sans-serif;font-size:23px;font-weight:500;letter-spacing:-0.5px;color:var(--navy);}
  @keyframes bloom{from{opacity:0;transform:scale(.5) rotate(-20deg);}to{opacity:1;transform:scale(1) rotate(0);}}

  /* Icône bouclier */
  .shield{
    width:56px;height:56px;margin:0 auto 20px;
    border-radius:16px;
    background:linear-gradient(180deg, #eaf3fd 0%, #dcecfb 100%);
    display:grid;place-items:center;
  }
  .shield svg{width:26px;height:26px;stroke:var(--blue-accent);fill:none;}

  .head{text-align:center;margin-bottom:26px;}
  .head h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--navy);margin-bottom:9px;}
  .head p{font-size:14px;color:var(--muted);line-height:1.55;}

  /* Champs code OTP */
  .otp{display:flex;justify-content:center;gap:9px;margin:8px 0 8px;}
  .otp input{
    width:48px;height:56px;
    text-align:center;
    font-family:'Fraunces',serif;font-size:24px;font-weight:500;color:var(--navy);
    border:1.5px solid var(--line);border-radius:12px;
    background:var(--white);
    transition:border-color .18s, box-shadow .18s;
  }
  .otp input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(55,138,221,.12);}
  .otp input.filled{border-color:var(--blue-light);}

  .err{
    text-align:center;font-size:12.5px;color:#c0392b;
    min-height:18px;margin:6px 0 2px;
    opacity:0;transition:opacity .15s;
  }
  .err.show{opacity:1;}

  .submit{
    width:100%;padding:13px 16px;margin-top:8px;
    border:none;border-radius:11px;
    background:linear-gradient(180deg,#4795e4 0%,var(--blue) 100%);
    color:#fff;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 16px rgba(55,138,221,.32);
    transition:transform .06s, filter .18s, box-shadow .18s;
  }
  .submit:hover{filter:brightness(1.05);box-shadow:0 8px 20px rgba(55,138,221,.4);}
  .submit:active{transform:translateY(1px);}

  .resend{text-align:center;margin-top:20px;font-size:13px;color:var(--muted);}
  .resend a{color:var(--blue-accent);text-decoration:none;font-weight:600;cursor:pointer;}
  .resend a:hover{text-decoration:underline;}

  .backup{
    margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    text-align:center;font-size:12.5px;color:var(--muted);
  }
  .backup a{color:var(--blue-accent);text-decoration:none;font-weight:600;}
  .backup a:hover{text-decoration:underline;}

  @media (max-width:440px){
    .card{padding:36px 22px 30px;border-radius:18px;}
    .otp{gap:7px;}
    .otp input{width:42px;height:52px;font-size:22px;}
  }
</style>
</head>
<body>

  <div class="card">

    <div class="logo">
      <svg class="symbol" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bloomanji">
        <g transform="translate(50,50)">
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#378ADD"/>
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#85B7EB" transform="rotate(90)"/>
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#378ADD" transform="rotate(180)"/>
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#85B7EB" transform="rotate(270)"/>
          <circle cx="0" cy="0" r="7" fill="#185FA5"/>
        </g>
      </svg>
      <span class="wordmark">bloomanji</span>
    </div>

    <div class="shield">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>

    <div class="head">
      <h1>Vérification en deux étapes</h1>
      <p>Saisissez le code à 6 chiffres généré par votre application d'authentification.</p>
    </div>

    <div class="otp" id="otp">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 1">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 2">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 3">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 4">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 5">
      <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 6">
    </div>

    <p class="err" id="err">Code incorrect. Réessayez.</p>

    <button type="button" class="submit">Vérifier</button>

    <p class="resend">Le code expire toutes les 30 secondes.</p>

    <div class="backup">
      Vous n'avez pas accès à votre application ? <a href="#">Utiliser un code de secours</a>
    </div>

  </div>

  <script>
    // Navigation fluide entre les 6 cases (démo visuelle)
    const inputs = Array.from(document.querySelectorAll('#otp input'));
    inputs.forEach((input, i) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');
        input.classList.toggle('filled', input.value !== '');
        if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus();
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6).split('');
        digits.forEach((d, j) => { if (inputs[j]) { inputs[j].value = d; inputs[j].classList.add('filled'); } });
        if (digits.length) inputs[Math.min(digits.length, 5)].focus();
      });
    });
  </script>

</body>
</html>
