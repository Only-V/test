<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se connecter — Bloomanji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C447C;
    --blue:#378ADD;
    --blue-light:#85B7EB;
    --blue-accent:#185FA5;
    --text:#1c2b3a;
    --muted:#6b7c90;
    --line:#e6ecf3;
    --bg:#eef3f9;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(90% 60% at 50% -10%, #e2ecf8 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:22px;
    padding:44px 40px 38px;
    box-shadow:0 20px 50px -24px rgba(12,68,124,.28), 0 2px 8px rgba(12,68,124,.04);
  }

  /* Logo empilé */
  .logo{
    display:flex;flex-direction:column;align-items:center;gap:9px;
    margin-bottom:26px;
  }
  .logo .symbol{width:42px;height:42px;animation:bloom 1s cubic-bezier(.2,.8,.2,1) both;}
  .logo .wordmark{
    font-family:'Inter',sans-serif;
    font-size:23px;font-weight:500;letter-spacing:-0.5px;
    color:var(--navy);
  }
  @keyframes bloom{from{opacity:0;transform:scale(.5) rotate(-20deg);}to{opacity:1;transform:scale(1) rotate(0);}}

  .head{text-align:center;margin-bottom:28px;}
  .head h1{
    font-family:'Fraunces',serif;
    font-weight:600;font-size:25px;color:var(--navy);
    margin-bottom:7px;
  }
  .head p{font-size:14px;color:var(--muted);}

  /* OAuth */
  .oauth{display:flex;flex-direction:column;gap:10px;}
  .oauth button{
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:11px;
    padding:12px 16px;
    border:1.5px solid var(--line);
    border-radius:11px;
    background:var(--white);
    font-family:inherit;font-size:14px;font-weight:500;color:var(--text);
    cursor:pointer;
    transition:border-color .18s, box-shadow .18s, transform .06s;
  }
  .oauth button:hover{border-color:#cdd9e8;box-shadow:0 3px 12px rgba(12,68,124,.07);}
  .oauth button:active{transform:translateY(1px);}
  .oauth button svg{width:18px;height:18px;flex-shrink:0;}

  .divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-size:12.5px;}
  .divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line);}

  .field{margin-bottom:16px;}
  .field .label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--text);}
  .field .forgot{font-size:12.5px;color:var(--blue-accent);text-decoration:none;font-weight:600;}
  .field .forgot:hover{text-decoration:underline;}
  .field .input-wrap{position:relative;}
  .field input{
    width:100%;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:11px;
    font-family:inherit;font-size:14px;color:var(--text);background:var(--white);
    transition:border-color .18s, box-shadow .18s;
  }
  .field input::placeholder{color:#aab6c6;}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(55,138,221,.12);}
  .toggle-pw{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;color:var(--muted);
    font-size:12px;font-weight:600;padding:4px 5px;
  }

  .remember{
    display:flex;align-items:center;gap:9px;
    margin:2px 0 22px;font-size:13px;color:var(--muted);
  }
  .remember input{width:15px;height:15px;accent-color:var(--blue);flex-shrink:0;cursor:pointer;}

  .submit{
    width:100%;padding:13px 16px;
    border:none;border-radius:11px;
    background:linear-gradient(180deg,#4795e4 0%,var(--blue) 100%);
    color:#fff;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
    box-shadow:0 6px 16px rgba(55,138,221,.32);
    transition:transform .06s, filter .18s, box-shadow .18s;
  }
  .submit:hover{filter:brightness(1.05);box-shadow:0 8px 20px rgba(55,138,221,.4);}
  .submit:active{transform:translateY(1px);}

  .signup{text-align:center;margin-top:22px;font-size:13.5px;color:var(--muted);}
  .signup a{color:var(--blue-accent);text-decoration:none;font-weight:600;}
  .signup a:hover{text-decoration:underline;}

  .rgpd{
    margin-top:20px;text-align:center;
    font-size:11.5px;color:var(--muted);line-height:1.5;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .rgpd svg{width:13px;height:13px;stroke:var(--blue-accent);flex-shrink:0;fill:none;}

  @media (max-width:440px){
    .card{padding:36px 24px 30px;border-radius:18px;}
  }
</style>
</head>
<body>

  <div class="card">

    <!-- Logo empilé (symbole + wordmark) -->
    <div class="logo">
      <svg class="symbol" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bloomanji">
        <g transform="translate(50,50)">
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#378ADD"/>
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#85B7EB" transform="rotate(90)"/>
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#378ADD" transform="rotate(180)"/>
          <path d="M0,0 C-18,-20 -11,-35 0,-40 C11,-35 18,-20 0,0" fill="#85B7EB" transform="rotate(270)"/>
          <circle cx="0" cy="0" r="7" fill="#185FA5"/>
        </g>
      </svg>
      <span class="wordmark">bloomanji</span>
    </div>

    <div class="head">
      <h1>Bon retour</h1>
      <p>Connectez-vous à votre espace Bloomanji.</p>
    </div>

    <!-- OAuth -->
    <div class="oauth">
      <button type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continuer avec Google
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>
        Continuer avec Microsoft
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg"><path d="M16.36 12.78c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.28-1.6 2.77-.41 6.87 1.15 9.12.76 1.1 1.67 2.34 2.86 2.29 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.09 5.86c.64-.77 1.07-1.85.95-2.92-.92.04-2.03.61-2.68 1.38-.59.68-1.1 1.77-.96 2.82 1.02.08 2.06-.52 2.69-1.28z"/></svg>
        Continuer avec Apple
      </button>
    </div>

    <div class="divider">ou avec votre email</div>

    <!-- Email + mot de passe -->
    <div class="field">
      <div class="label-row">
        <label for="email">Adresse email</label>
      </div>
      <input id="email" type="email" placeholder="camille@entreprise.com" autocomplete="email">
    </div>

    <div class="field">
      <div class="label-row">
        <label for="pw">Mot de passe</label>
        <a href="#" class="forgot">Mot de passe oublié ?</a>
      </div>
      <div class="input-wrap">
        <input id="pw" type="password" placeholder="Votre mot de passe" autocomplete="current-password">
        <button type="button" class="toggle-pw" onclick="var i=document.getElementById('pw');var s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'Masquer':'Afficher';">Afficher</button>
      </div>
    </div>

    <label class="remember">
      <input type="checkbox">
      <span>Rester connecté sur cet appareil</span>
    </label>

    <button type="button" class="submit">Se connecter</button>

    <p class="signup">Pas encore de compte ? <a href="#">Créer un compte</a></p>

    <p class="rgpd">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Données hébergées en Europe, jamais revendues.
    </p>

  </div>

</body>
</html>
